<style>

*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 "Segoe UI Variable","Segoe UI",sans-serif}button,input,select{font:inherit}button,a,summary,input,select{outline-offset:3px}:focus-visible{outline:3px solid var(--focus)}button,.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:white;color:var(--ink);border:1px solid #bec9ce;border-radius:5px;padding:9px 15px;cursor:pointer;text-decoration:none;font-weight:600}button:hover:not(:disabled),.button:hover{background:#edf4f1;border-color:var(--felt)}button.primary,.button.primary{background:var(--felt);border-color:var(--felt);color:white}button:disabled{opacity:.5;cursor:default}a{color:var(--felt)}.hidden{display:none!important}.muted,.hint{color:var(--muted)}.hint{font-size:13px;margin:6px 0 0}h1{font-size:26px;line-height:1.25;margin:0 0 24px;font-weight:650}h2{font-size:21px;margin:0 0 16px}h3{font-size:17px;margin:0 0 12px}p{max-width:68ch;margin:0 0 16px}header{background:white;border-bottom:1px solid var(--line)}.topbar{max-width:1560px;margin:auto;min-height:68px;padding:12px 28px;display:flex;gap:28px;align-items:center}.brand{font-size:19px;font-weight:700;color:var(--felt);text-decoration:none;white-space:nowrap}.project-switch{margin-left:auto;display:flex;align-items:center;gap:10px}.project-switch button{white-space:nowrap}.project-switch select{max-width:300px;min-width:170px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}main{max-width:1560px;margin:auto;padding:24px 28px 48px}.panel{background:white;border:1px solid var(--line);border-radius:7px;padding:28px}.intake{max-width:700px;margin:26px auto}.field{margin:0 0 22px}label{display:block;font-weight:600;margin-bottom:7px}input,select{background:white;border:1px solid #acbac2;border-radius:4px;padding:10px 12px;color:var(--ink);width:100%;min-width:0}input[type=file]{padding:14px;background:var(--page)}.source-tabs,.project-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:0 0 24px}.source-tabs button,.project-tabs button{border:0;border-radius:0;border-bottom:3px solid transparent;padding:10px 2px 12px;background:transparent;font-weight:500}.source-tabs button[aria-selected=true],.project-tabs button[aria-selected=true]{border-color:var(--felt);color:var(--felt);font-weight:650}.project-tabs{margin:0 0 20px}.project-tabs button{font-size:16px;padding:10px 3px 14px}.count{display:inline-block;font-size:12px;background:#e7efed;border-radius:12px;min-width:23px;padding:1px 6px;margin-left:5px;color:var(--felt)}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.notice{padding:14px 18px;border-left:3px solid #bc8539;background:#fff7e9;margin-bottom:20px}.error{background:#fff0f2;border-color:var(--error);color:var(--error);white-space:pre-wrap;overflow-wrap:anywhere}#global-error:empty{display:none}details{margin-top:22px}summary{cursor:pointer;color:var(--muted)}details .field{margin-top:18px}.progress{width:100%;height:7px;accent-color:var(--felt);margin:12px 0}.log{background:var(--page);font:12px/1.6 Consolas,monospace;max-height:230px;overflow:auto;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere}.processing{max-width:760px;padding:24px 0}.processing h2{margin-bottom:8px}.review-shell iframe{display:block;width:100%;height:760px;border:0;background:transparent}.settings{max-width:760px}.settings-section+.settings-section{margin-top:32px;padding-top:26px;border-top:1px solid var(--line)}.results-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:32px}.game-button{width:100%;display:block;text-align:left;border:0;border-left:3px solid transparent;border-radius:0;background:transparent;margin:0 0 6px;padding:12px 15px}.game-button.active{border-color:var(--felt);background:#e8f0ed}.game-button small{display:block;font-weight:400;color:var(--muted)}.result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:24px}.result-head h2{margin-bottom:4px}.players{color:var(--muted);margin:0}.hand-table{width:100%;border-collapse:collapse;background:white}.hand-table th,.hand-table td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line)}.hand-table th{font-size:13px;color:var(--muted);font-weight:500}.hand-table td:last-child{text-align:right}.hand-table a{font-weight:600}.small{font-size:13px;padding:6px 10px}.game-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.copy-status{font-size:13px;color:var(--felt)}.result-details a{margin-right:18px}.empty{padding:24px;color:var(--muted)}
@media(max-width:800px){.topbar{padding:12px 18px;gap:15px}main{padding:18px 16px 32px}.results-layout{grid-template-columns:1fr;gap:18px}.games{display:flex;gap:6px;overflow:auto}.game-button{min-width:155px;border-left:0;border-bottom:3px solid transparent}.result-head{display:block}.result-head .actions{margin-top:16px}.project-switch select{min-width:100px;max-width:190px}.panel{padding:22px}}
@media(max-width:480px){.topbar{flex-wrap:wrap}.brand{font-size:18px}.project-switch{width:100%;margin:0}.project-switch select{max-width:none;flex:1}.project-tabs{gap:24px}.intake{margin:6px auto}.source-tabs{gap:16px}.source-tabs button{font-size:14px}.hand-table th,.hand-table td{padding:12px 8px}.result-head .button{font-size:14px}}
</style>
</head>
<body>
<header><div class="topbar"><a class="brand" href="/">video2tenhou</a><div class="project-switch"><label class="sr-only" for="project-picker">Recording</label><select id="project-picker"></select><button id="new-project">Add recording</button></div></div></header>
<main>
<div id="setup" class="notice hidden"></div><div id="global-error" class="notice error" role="alert"></div>
<section class="panel intake" id="intake"><h1>Add recording</h1><form id="create-form">
<div class="source-tabs" role="tablist" aria-label="Video source"><button type="button" role="tab" data-source="existing" aria-selected="true">Saved video</button><button type="button" role="tab" data-source="upload" aria-selected="false">Upload</button><button type="button" role="tab" data-source="url" aria-selected="false">Video URL</button></div>
<div id="source-existing" class="field"><div id="saved-videos"><label for="local-source">Video</label><select id="local-source"></select></div><details id="path-entry"><summary>Enter a video path</summary><div class="field"><label for="local-path">Video path</label><input id="local-path" placeholder="D:\Recordings\broadcast.mp4"></div></details></div>
<div id="source-upload" class="field hidden"><label for="upload-source">Video file</label><input id="upload-source" type="file" accept="video/*,.mkv"></div>
<div id="source-url" class="field hidden"><label for="url-source">Video URL</label><input id="url-source" type="url" placeholder="https://www.twitch.tv/videos/2874520836"></div>
<div class="field"><label for="games">Scoremj games</label><input id="games" required placeholder="21938, 21939"><p class="hint">Game IDs or links, in broadcast order.</p></div>
<div class="actions" style="margin-top:24px"><button class="primary" id="create-button">Prepare recording</button><span id="intake-status" class="hint" role="status" aria-live="polite"></span></div><progress id="upload-progress" class="progress hidden" value="0" max="100" aria-label="Uploading recording"></progress>
<details><summary>Layout</summary><div class="field"><label for="layout">Layout file</label><input id="layout" placeholder="PML (default)"></div></details>
</form></section>
<section id="project" class="hidden"><nav id="project-tabs" class="project-tabs" role="tablist" aria-label="Project"></nav><div id="job-status"></div><div id="project-pane"></div><div id="review-shell" class="review-shell hidden"><iframe id="review-frame" title="Review recording"></iframe></div></section>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sourceKind = 'existing', selected = null, projects = [], setupReady = false, busy = false;
let activeView = null, renderedView = null, resultsData = null, resultsRevision = '', activeGame = 0, resultRequest = 0, resultsLoading = null;
let calibrationDirty = false;
const headers = {'Content-Type':'application/json','X-Video2Tenhou':'1'};
async function api(path, body) {
  const response = await fetch(path, body === undefined ? {} : {method:'POST', headers, body:JSON.stringify(body)});
  let data; try { data = await response.json(); } catch { throw new Error('Could not read the response. Try again.'); }
  if (!response.ok || data.error) throw new Error(data.error || `Request failed (${response.status}).`);
  return data;
}
function error(message) { $('global-error').textContent = message; }
function calibrationBlocked() {
  if (!calibrationDirty) return false;
  error('Save or discard your calibration changes before continuing.');
  $('project-picker').value = selected || '';
  return true;
}
function source(kind) {
  sourceKind = kind;
  for (const name of ['existing','upload','url']) $('source-' + name).classList.toggle('hidden', kind !== name);
  document.querySelectorAll('[data-source]').forEach(button => button.setAttribute('aria-selected', button.dataset.source === kind));
}
document.querySelectorAll('[data-source]').forEach(button => button.onclick = () => source(button.dataset.source));
function renderList() {
  const picker = $('project-picker');
  const options = '<option value="">Select recording</option>' + projects.slice().reverse().map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  if (picker.innerHTML !== options) picker.innerHTML = options;
  picker.value = selected || ''; picker.hidden = !projects.length;
  $('new-project').classList.toggle('hidden', !selected);
}
$('project-picker').onchange = event => { if(event.target.value) openProject(event.target.value); else showNew(); };
function showNew() {
  if (calibrationBlocked()) return;
  selected = null; activeView = renderedView = null; resultRequest++; location.hash = ''; error('');
  $('intake').classList.remove('hidden'); $('project').classList.add('hidden');
  $('review-frame').removeAttribute('src'); $('review-shell').classList.add('hidden'); renderList();
}
$('new-project').onclick = showNew;
function openProject(id) {
  if (id !== selected && calibrationBlocked()) return;
  if (selected !== id) {
    $('review-frame').removeAttribute('src'); activeView = renderedView = null;
    resultsData = null; resultsRevision = ''; activeGame = 0; resultRequest++;
  }
  selected = id; location.hash = id; error('');
  $('intake').classList.add('hidden'); $('project').classList.remove('hidden'); renderList();
  const p = projects.find(p => p.id === id); if (p) renderProject(p, true);
}
function setView(view) { if(calibrationBlocked())return; activeView = view; const p=projects.find(p=>p.id===selected); if(p) renderProject(p,true); }
function openReview(calibration) {
  const target = `/review/${selected}/?embedded=1${calibration ? '#calib' : ''}`;
  $('review-shell').classList.remove('hidden');
  if ($('review-frame').getAttribute('src') !== target) $('review-frame').src=target;
}
window.addEventListener('message', event => {
  if(event.origin !== location.origin || event.source !== $('review-frame').contentWindow) return;
  if(event.data?.type === 'video2tenhou:calibration-dirty' && typeof event.data.dirty === 'boolean') {
    calibrationDirty = event.data.dirty;
    if(!calibrationDirty) error('');
  }
  if(event.data?.type === 'video2tenhou:resize' && Number.isFinite(event.data.height))
    $('review-frame').style.height=Math.max(300, Math.min(20000, event.data.height))+'px';
});
async function action(kind) {
  if (calibrationBlocked()) return;
  if (busy || !selected) return; busy=true; error('');
  const projectId=selected;
  try { const p=await api(`/api/projects/${projectId}/${kind}`,{}); projects=projects.map(x=>x.id===p.id?p:x); if(selected===projectId){activeView='analyze'; renderedView=null; renderProject(p,true);} }
  catch(e) { if(selected===projectId)error(e.message); } finally { busy=false; }
}
function renderProject(p, force=false) {
  const hasResults=p.artifacts.some(f=>/^g\d+\.json$/.test(f)), running=p.job.running;
  if(!activeView || (activeView==='analyze' && hasResults && !running)) activeView=hasResults?'review':'analyze';
  if(!hasResults && ['review','results'].includes(activeView)) activeView='analyze';
  const tabs=running?[['analyze','Analysis'],...(hasResults?[['results','Results']]:[]),['settings','Settings']]:hasResults?[['review','Review'],['results','Results'],['settings','Settings']]:[['analyze','Analyze'],['settings','Settings']];
  const nav=tabs.map(([view,label])=>`<button role="tab" data-view="${view}" aria-selected="${activeView===view}">${label}${view==='review'&&p.open_items?` <span class="count">${p.open_items}</span>`:''}</button>`).join('');
  if($('project-tabs').innerHTML!==nav) $('project-tabs').innerHTML=nav;
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  const failureLogOpen=$('failure-log')?.open;
  $('job-status').innerHTML=p.job.error?`<div class="notice error" role="alert">${esc(p.job.error)}</div>${p.job.log?.length?`<details id="failure-log" ${failureLogOpen?'open':''} style="margin:0 0 20px"><summary>Processing log</summary><pre class="log">${esc(p.job.log.join('\n'))}</pre></details>`:''}`:'';
  const stateKey=JSON.stringify([p.id,activeView,running,p.has_fit,hasResults,p.stale_exports]);
  const changed=force||renderedView!==stateKey;
  if(activeView==='results') {
    $('review-shell').classList.add('hidden');
    if(changed||resultsRevision!==JSON.stringify([p.results_revision,p.pending_rebuilds])) loadResults(p);
  } else if(activeView==='review') {
    $('project-pane').innerHTML=''; openReview(false);
  } else if(activeView==='settings') {
    if(changed) { $('review-shell').classList.add('hidden'); renderSettings(p); }
  } else {
    // The processing panel is the only view that redraws during polling.
    $('review-shell').classList.toggle('hidden',running||!p.has_fit);
    const elapsed=p.job.started?Math.floor(((p.job.finished||Date.now()/1000)-p.job.started)/60):0;
    const logOpen=!changed&&$('processing-log')?.open;
    $('project-pane').innerHTML=running?`<section class="processing"><h2>${esc(p.job.stage||'Analyzing recording')}</h2><span class="muted">${elapsed} min elapsed</span><progress class="progress" aria-label="Processing"></progress><details id="processing-log" ${logOpen?'open':''}><summary>Processing log</summary><pre class="log">${esc((p.job.log||[]).join('\n'))}</pre></details></section>`:p.has_fit?`<div class="actions" style="margin-bottom:20px"><h2 style="margin:0 auto 0 0">Check calibration</h2><button class="primary" id="analyze-button">Analyze recording</button></div>`:`<section class="processing"><h2>Prepare recording</h2><button class="primary" id="prepare-button">Prepare recording</button></section>`;
    if(!running&&p.stale_exports) $('job-status').innerHTML+=`<div class="notice">Recording inputs changed. ${p.has_fit?'Analyze the recording':'Prepare the recording again'} to refresh the results.</div>`;
    if(!running&&p.has_fit) openReview(true);
    if($('analyze-button')) $('analyze-button').onclick=()=>action('analyze');
    if($('prepare-button')) $('prepare-button').onclick=()=>action('prepare');
  }
  renderedView=stateKey;
}
function renderSettings(p) {
  $('project-pane').innerHTML=`<div class="panel settings"><section class="settings-section"><h2>Recording settings</h2><form id="settings-form"><div class="field"><label for="settings-games">Scoremj games</label><input id="settings-games" required value="${esc(p.games.join(', '))}"></div><div class="field"><label for="settings-layout">Layout</label><input id="settings-layout" value="${esc(p.layout)}"></div><button class="primary" ${p.job.running?'disabled':''}>Save settings</button><span id="settings-saved" class="hint" role="status"></span></form></section><section class="settings-section"><h3>Processing</h3><div class="actions"><button id="adjust-button" ${!p.has_fit||p.job.running?'disabled':''}>Calibration</button><button id="analyze-button" ${!p.has_fit||p.job.running?'disabled':''}>Analyze again</button></div><details><summary>Advanced</summary><div class="actions" style="margin-top:16px"><button id="prepare-button" ${p.job.running?'disabled':''}>Measure table again</button></div>${p.job.log?.length&&!p.job.error?`<details><summary>Processing log</summary><pre class="log">${esc(p.job.log.join('\n'))}</pre></details>`:''}</details></section></div>`;
  $('adjust-button').onclick=()=>{ $('project-pane').innerHTML='<button id="back-settings" class="small" style="margin-bottom:16px">Back to settings</button>'; $('back-settings').onclick=()=>setView('settings'); openReview(true); };
  $('analyze-button').onclick=()=>action('analyze'); $('prepare-button').onclick=()=>action('prepare');
  $('settings-form').onsubmit=async event=>{
    event.preventDefault(); error('');
    if(calibrationBlocked())return;
    try { const updated=await api(`/api/projects/${p.id}/settings`,{games:gameIds($('settings-games').value),layout:$('settings-layout').value.trim()}); projects=projects.map(x=>x.id===updated.id?updated:x); if(selected!==p.id)return; $('review-frame').removeAttribute('src'); resultsData=null; renderProject(updated,true); if(activeView==='settings'&&$('settings-saved'))$('settings-saved').textContent=' Saved'; }
    catch(e){if(selected===p.id)error(e.message);}
  };
}
async function loadResults(p) {
  if(resultsLoading?.id===p.id&&resultsLoading.request===resultRequest) return;
  const request=++resultRequest;
  resultsLoading={id:p.id,request};
  $('project-pane').innerHTML='<p class="empty" role="status">Loading results…</p>';
  try { const data=await api(`/api/projects/${p.id}/results`);
    if(request!==resultRequest||selected!==p.id||activeView!=='results') return;
    resultsData=data; resultsRevision=JSON.stringify([data.revision,data.pending_rebuilds]); renderResults(p);
  }catch(e){if(request===resultRequest&&selected===p.id&&activeView==='results') error(e.message);}
  finally { if(resultsLoading?.request===request)resultsLoading=null; }
}
function renderResults(p) {
  const games=resultsData.games; if(!games.length){$('project-pane').innerHTML='<p class="empty">No game logs yet.</p>';return;}
  const game=games.find(g=>g.index===activeGame)||games[0]; activeGame=game.index;
  const pending=resultsData.pending_games.includes(game.index);
  $('project-pane').innerHTML=`<div class="results-layout"><aside class="games" aria-label="Games">${games.map(g=>`<button class="game-button ${g.index===activeGame?'active':''}" data-game="${g.index}">Hanchan ${g.index+1}<small>${g.hands.length} hands</small></button>`).join('')}</aside><section><div class="result-head"><div><h2>Hanchan ${game.index+1}</h2><p class="players">${game.names.map(esc).join(' · ')}</p></div><div class="actions ${pending?'hidden':''}"><a class="button primary" href="${esc(game.viewer_url)}" target="_blank" rel="noopener">Open replay</a><a class="button" href="${esc(game.download)}" download>Download JSON</a></div></div>${pending?'<p role="status">Saved changes need a rebuild in Review.</p>':''}<div class="game-actions ${pending?'hidden':''}"><span class="muted">Hands</span><div class="actions"><span id="copy-status" class="copy-status" role="status"></span><button class="small" id="copy-all">Copy all hand links</button></div></div><table class="hand-table ${pending?'hidden':''}"><thead><tr><th>Round</th><th>Honba</th><th><span class="sr-only">Hand link</span></th></tr></thead><tbody>${game.hands.map(h=>`<tr><td><a href="${esc(h.editor_url)}" target="_blank" rel="noopener">${esc(h.round)}</a></td><td>${h.honba}</td><td><button class="small" data-copy="${h.index}">Copy link</button></td></tr>`).join('')}</tbody></table><details class="result-details"><summary>Reports</summary><p>${p.artifacts.filter(f=>f==='report.md'||f==='review.json'||f.endsWith('.confidence.json')).map(f=>`<a href="/exports/${p.id}/${f}" download>${esc(f)}</a>`).join('')}</p></details></section></div>`;
  document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{activeGame=Number(b.dataset.game);renderResults(p);});
  const copy=async text=>{try{await navigator.clipboard.writeText(text);$('copy-status').textContent='Copied';}catch{$('copy-status').textContent='Copy unavailable';}};
  $('copy-all').onclick=()=>copy(game.hands.map(h=>h.editor_url).join('\n'));
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(game.hands.find(h=>h.index===Number(b.dataset.copy)).editor_url));
}
function gameIds(text) {
  const parts = text.trim().split(/[\s,]+/).filter(Boolean);
  if (!parts.length) throw new Error('Enter the scoremj game IDs in recording order.');
  return parts.map(part => {
    let value = part;
    if (part.startsWith('https://')) { const u = new URL(part); if (!/(^|\.)scoremj\.com$/.test(u.hostname)) throw new Error('Use scoremj game links or numeric game IDs.'); value = u.searchParams.get('id') || u.pathname.match(/\d+\/?$/)?.[0]?.replace('/','') || ''; }
    if (!/^\d+$/.test(value) || Number(value) <= 0 || !Number.isSafeInteger(Number(value))) throw new Error('Use positive game IDs, separated by commas or spaces.');
    return Number(value);
  });
}
function upload(file) {
  return new Promise((resolve,reject) => {
    const request = new XMLHttpRequest(); request.open('POST','/api/upload');
    request.setRequestHeader('X-Video2Tenhou','1'); request.setRequestHeader('X-Filename',encodeURIComponent(file.name));
    request.upload.onprogress = event => { if (event.lengthComputable) { $('upload-progress').value = event.loaded/event.total*100; $('intake-status').textContent = `Copying recording… ${Math.round(event.loaded/event.total*100)}%`; } };
    request.onerror = () => reject(new Error('The upload connection was lost. Keep the app open and retry.'));
    request.onload = () => { try { const data = JSON.parse(request.responseText); if (request.status >= 400) throw new Error(data.error); resolve(data.path); } catch(e) { reject(e); } };
    request.send(file);
  });
}
$('create-form').onsubmit = async event => {
  event.preventDefault(); error(''); const button = $('create-button'); button.disabled = true;
  try {
    const games = gameIds($('games').value);
    let video = sourceKind === 'url' ? $('url-source').value.trim() : ($('local-path').value.trim() || $('local-source').value);
    if (sourceKind === 'upload') { const file = $('upload-source').files[0]; if (!file) throw new Error('Choose a video file.'); $('upload-progress').classList.remove('hidden'); video = await upload(file); }
    if (!video) throw new Error('Choose a recording or paste a video URL.');
    const project = await api('/api/projects', {source:video,kind:sourceKind === 'url' ? 'url' : 'local',games,layout:$('layout').value.trim()});
    projects.push(project); openProject(project.id); if (!project.has_fit) await action('prepare');
  } catch(e) { error(e.message); } finally { button.disabled = false; $('upload-progress').classList.add('hidden'); $('intake-status').textContent = ''; }
};
async function refresh(first=false) {
  try {
    const data=await api('/api/workspace'); projects=data.projects; setupReady=data.setup.ready;
    if(first) {
      $('local-source').innerHTML=data.sources.length?data.sources.map(s=>`<option value="${esc(s.path)}">${esc(s.name)}</option>`).join(''):'<option value="">No saved videos</option>';
      $('saved-videos').classList.toggle('hidden', !data.sources.length);
      $('path-entry').open = !data.sources.length;
      if(!data.sources.length) source('upload');
      $('setup').classList.toggle('hidden',setupReady);
      if(!setupReady) $('setup').innerHTML=`<strong>Missing setup files</strong><ul>${data.setup.missing.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
      const saved=location.hash.slice(1); if(projects.some(p=>p.id===saved)) openProject(saved);
    }
    renderList(); if(selected){const p=projects.find(p=>p.id===selected);if(p)renderProject(p);}
  }catch(e){error(e.message);}
}
refresh(true); setInterval(()=>refresh(),2500);
</script></body></html>
