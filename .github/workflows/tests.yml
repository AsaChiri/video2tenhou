name: Tests and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - if: runner.os == 'Linux'
        run: npm run test:browser
        working-directory: frontend
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check --error-on-warning
      - run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml
      - run: uv build
      - run: uv run python tools/check_dist.py
      - run: uv run python tools/check_source_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-and-coverage-${{ runner.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            coverage.xml
