[project]
name = "video2tenhou"
version = "0.1.0"
description = "Review and convert riichi mahjong broadcast recordings into Tenhou game logs locally"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "pytesseract>=0.3.13",
    "yt-dlp>=2026.8.19",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "mahjong>=2.0.0",
    "ortools>=9.15.6755",
    "libreyolo==1.5.0",
]

[project.scripts]
video2tenhou = "video2tenhou.cli:main"

[project.urls]
Repository = "https://github.com/AsaChiri/video2tenhou"
Issues = "https://github.com/AsaChiri/video2tenhou/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "psutil>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video2tenhou"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "tools/", "README.md", "LICENSE*", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "uv.lock", ".python-version", "Start.cmd", "start.sh"]

[tool.coverage.run]
source = ["video2tenhou"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
