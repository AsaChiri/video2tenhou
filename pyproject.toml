[project]
name = "video2tenhou"
version = "0.3.0"
description = "Review and convert riichi mahjong broadcast recordings into Tenhou game logs locally"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3,<3",
    "opencv-python>=5.0.0.93,<6",
    "yt-dlp>=2026.8.19",
    "torch>=2.6,<3",
    "torchvision>=0.21,<0.30",
    "mahjong>=2.0.0",
    "ortools>=9.15.6755",
    "libreyolo>=1.5,<1.6",
    "psutil>=7.2.2",
    "pywin32>=312; sys_platform == 'win32'",
    "starlette>=1.7,<2",
    "uvicorn>=0.54,<1",
    "anyio>=4.15,<5",
    "httpx>=0.28,<1",
]

[project.scripts]
video2tenhou = "video2tenhou.cli:main"

[project.urls]
Repository = "https://github.com/AsaChiri/video2tenhou"
Issues = "https://github.com/AsaChiri/video2tenhou/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "types-pywin32>=312.0.0.20260928",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video2tenhou"]

[tool.hatch.build]
artifacts = ["src/video2tenhou/tool/static/index.html", "src/video2tenhou/tool/static/assets/**"]

[tool.hatch.build.targets.sdist]
include = ["src/", "frontend/", "tests/", "docs/", "tools/", "README.md", "CHANGELOG.md", "LICENSE*", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "uv.lock", ".python-version", "Start.cmd", "start.sh"]
exclude = [
    "frontend/node_modules/",
    "frontend/test-results/",
    "frontend/playwright-report/",
]

[tool.coverage.run]
source = ["video2tenhou"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "slow: recorded-hand reconstructions with CP-SAT searches; deselect with -m 'not slow' for a quick loop",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Approved by the maintainer: incompatible docstring/formatter rules.
    "D203",
    "D213",
    "COM812",
    # Approved: noun-phrase summaries; forcing the imperative mood doubled docstrings.
    "D401",
    # Approved: inline exception messages instead of a `msg` variable before each raise.
    "EM101",  # string literal message
    "EM102",  # f-string message
    "TRY003",  # long message outside the exception class
]

[tool.ruff.lint.pylint]
# Approved: up to eight arguments; parameter objects that only dodged five hid signatures.
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Approved: pytest assertions, numeric expectations and checks of internal behavior.
# Test doubles also retain unused named parameters to match real interfaces.
# Approved: test names document tests (D), annotations are optional in tests (ANN)
# and tests need no type-checking-only import blocks (TC).
"tests/**/*.py" = ["S101", "PLR2004", "SLF001", "ARG001", "ARG002", "D", "ANN", "TC"]
# Approved by the maintainer: non-security training-image augmentation.
"src/video2tenhou/train/data.py" = ["S311"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
respect-type-ignore-comments = false
